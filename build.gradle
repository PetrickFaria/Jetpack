plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

group = 'br.com.petrickfaria.jetpack'
version = '0.1.0'
archivesBaseName = 'jetpack'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { jetpack { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test { useJUnitPlatform() }

jar {
    manifest {
        attributes([
            'Specification-Title': 'jetpack',
            'Specification-Vendor': 'PetrickFaria',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'PetrickFaria',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.register('verifyModJarAssets') {
    dependsOn reobfJar
    doLast {
        def jarFile = tasks.jar.archiveFile.get().asFile
        def tiers = ['wood', 'iron', 'gold', 'emerald', 'diamond', 'netherite']
        def expectedPngHeader = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a] as byte[]
        def archive = new java.util.zip.ZipFile(jarFile)
        try {
            tiers.each { tier ->
                def stem = "jetpack_${tier}"
                def modelPath = "assets/jetpack/models/item/${stem}.json"
                def texturePath = "assets/jetpack/textures/item/${stem}.png"
                def modelEntry = archive.getEntry(modelPath)
                def textureEntry = archive.getEntry(texturePath)
                if (modelEntry == null) throw new GradleException("Missing model in JAR: ${modelPath}")
                if (textureEntry == null) throw new GradleException("Missing texture in JAR: ${texturePath}")

                def model = new groovy.json.JsonSlurper().parse(archive.getInputStream(modelEntry))
                def expectedTexture = "jetpack:item/${stem}"
                if (model.parent != 'minecraft:item/generated' || model.textures?.layer0 != expectedTexture) {
                    throw new GradleException("Invalid item model or texture reference in ${modelPath}")
                }

                def input = archive.getInputStream(textureEntry)
                try {
                    def actualHeader = new byte[expectedPngHeader.length]
                    if (input.read(actualHeader) != actualHeader.length || !java.util.Arrays.equals(actualHeader, expectedPngHeader)) {
                        throw new GradleException("Invalid PNG texture in JAR: ${texturePath}")
                    }
                } finally {
                    input.close()
                }
            }
            logger.lifecycle("Verified six jetpack item models and PNG textures in ${jarFile.name}")
        } finally {
            archive.close()
        }
    }
}
