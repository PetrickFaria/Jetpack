plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

group = 'br.com.petrickfaria.jetpack'
version = '0.1.0'
archivesBaseName = 'jetpack'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { jetpack { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test { useJUnitPlatform() }

jar {
    manifest {
        attributes([
            'Specification-Title': 'jetpack',
            'Specification-Vendor': 'PetrickFaria',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'PetrickFaria',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.register('verifyModJarAssets') {
    dependsOn processResources, reobfJar
    doLast {
        // Verify source resources, Gradle's processed output, and the exact distributable JAR.
        def jarFile = tasks.jar.archiveFile.get().asFile
        def sourceResources = file('src/main/resources')
        def processedResources = sourceSets.main.output.resourcesDir
        def tiers = ['wood', 'iron', 'gold', 'emerald', 'diamond', 'netherite']
        def perspectives = ['firstperson_righthand', 'firstperson_lefthand', 'thirdperson_righthand', 'thirdperson_lefthand']
        def atlasRects = [[2,2,18,13], [23,2,13,16], [39,2,13,16], [55,2,16,8], [74,2,18,8],
                          [95,2,8,14], [106,2,8,14], [117,2,10,8], [130,2,3,6], [135,2,8,9],
                          [2,21,8,9], [12,21,12,10], [26,21,12,10], [40,21,14,9], [56,21,14,9],
                          [72,21,10,7], [84,21,10,7]]
        def backModelSource = new File(projectDir, 'src/main/java/br/com/petrickfaria/jetpack/client/JetpackBackModel.java').text
        def backLayerSource = new File(projectDir, 'src/main/java/br/com/petrickfaria/jetpack/client/JetpackBackLayer.java').text
        atlasRects.each { rect ->
            if (!backModelSource.contains(".texOffs(${rect[0]}, ${rect[1]})")) {
                throw new GradleException("No back-model UV offset matches atlas island ${rect[0]},${rect[1]}")
            }
        }
        if (!backLayerSource.contains('textures/entity/back/')) {
            throw new GradleException('Back layer does not load the dedicated UV atlas folder')
        }
        def expectedPngHeader = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a] as byte[]
        int[] woodPixels = null
        int woodWidth = -1
        int woodHeight = -1
        def archive = new java.util.zip.ZipFile(jarFile)
        try {
            def packMetaEntry = archive.getEntry('pack.mcmeta')
            if (packMetaEntry == null) throw new GradleException('Missing pack.mcmeta at the JAR root')
            [new File(sourceResources, 'pack.mcmeta'), new File(processedResources, 'pack.mcmeta')].each { file ->
                if (!file.isFile()) throw new GradleException("Resource processing omitted: ${file}")
            }
            def packMeta = new groovy.json.JsonSlurper().parse(archive.getInputStream(packMetaEntry))
            if (packMeta.pack?.pack_format != 9) {
                throw new GradleException('Invalid pack.mcmeta: Minecraft 1.19.2 resource pack_format must be 9')
            }

            tiers.each { tier ->
                def stem = "jetpack_${tier}"
                def modelPath = "assets/jetpack/models/item/${stem}.json"
                def handModelPath = "assets/jetpack/models/item/${stem}_hand.json"
                def texturePath = "assets/jetpack/textures/item/${stem}.png"
                def entityTexturePath = "assets/jetpack/textures/entity/${stem}.png"
                def backAtlasPath = "assets/jetpack/textures/entity/back/${stem}.png"
                [modelPath, handModelPath, texturePath, entityTexturePath, backAtlasPath].each { resourcePath ->
                    if (!new File(sourceResources, resourcePath).isFile()) {
                        throw new GradleException("Missing source resource: ${resourcePath}")
                    }
                    if (!new File(processedResources, resourcePath).isFile()) {
                        throw new GradleException("Resource processing omitted: ${resourcePath}")
                    }
                }

                def modelEntry = archive.getEntry(modelPath)
                def handModelEntry = archive.getEntry(handModelPath)
                def textureEntry = archive.getEntry(texturePath)
                def entityTextureEntry = archive.getEntry(entityTexturePath)
                def backAtlasEntry = archive.getEntry(backAtlasPath)
                if (modelEntry == null) throw new GradleException("Missing model in JAR: ${modelPath}")
                if (handModelEntry == null) throw new GradleException("Missing hand model in JAR: ${handModelPath}")
                if (textureEntry == null) throw new GradleException("Missing texture in JAR: ${texturePath}")
                if (entityTextureEntry == null) throw new GradleException("Missing hand texture in JAR: ${entityTexturePath}")
                if (backAtlasEntry == null) throw new GradleException("Missing back UV atlas in JAR: ${backAtlasPath}")

                def model = new groovy.json.JsonSlurper().parse(archive.getInputStream(modelEntry))
                def expectedTexture = "jetpack:item/${stem}"
                if (model.loader != 'forge:separate_transforms' || model.base?.parent != 'minecraft:item/generated'
                        || model.base?.textures?.layer0 != expectedTexture) {
                    throw new GradleException("Invalid separated item model or inventory icon reference in ${modelPath}")
                }
                perspectives.each { perspective ->
                    if (model.perspectives?.get(perspective)?.parent != "jetpack:item/${stem}_hand") {
                        throw new GradleException("${modelPath} does not select the approved hand model for ${perspective}")
                    }
                }
                def handModel = new groovy.json.JsonSlurper().parse(archive.getInputStream(handModelEntry))
                if (handModel.parent != 'minecraft:item/generated'
                        || handModel.textures?.layer0 != "jetpack:entity/${stem}") {
                    throw new GradleException("Invalid hand model or approved illustration reference in ${handModelPath}")
                }

                def input = archive.getInputStream(textureEntry)
                try {
                    def actualHeader = new byte[expectedPngHeader.length]
                    if (input.read(actualHeader) != actualHeader.length || !java.util.Arrays.equals(actualHeader, expectedPngHeader)) {
                        throw new GradleException("Invalid PNG texture in JAR: ${texturePath}")
                    }
                } finally {
                    input.close()
                }

                def textureInput = archive.getInputStream(textureEntry)
                try {
                    def image = javax.imageio.ImageIO.read(textureInput)
                    if (image == null || image.colorModel.numComponents < 4) {
                        throw new GradleException("Texture has no alpha channel in JAR: ${texturePath}")
                    }
                    if (tier == 'wood') {
                        woodWidth = image.width
                        woodHeight = image.height
                        woodPixels = image.getRGB(0, 0, image.width, image.height, null, 0, image.width)
                    } else {
                        if (image.width != woodWidth || image.height != woodHeight) {
                            throw new GradleException("Icon dimensions differ from the wooden reference: ${texturePath}")
                        }
                    }
                    def alpha = image.getAlphaRaster()
                    def transparentPixels = 0
                    def opaquePixels = 0
                    def changedMaterialPixels = 0
                    for (int y = 0; y < image.height; y++) {
                        for (int x = 0; x < image.width; x++) {
                            int value = alpha.getSample(x, y, 0)
                            if (value == 0) transparentPixels++
                            if (value == 255) opaquePixels++
                            if (tier != 'wood') {
                                int index = y * image.width + x
                                int reference = woodPixels[index]
                                int current = image.getRGB(x, y)
                                if ((current >>> 24) != (reference >>> 24)) {
                                    throw new GradleException("Icon alpha mask differs from wooden reference: ${texturePath}")
                                }
                                float[] hsb = java.awt.Color.RGBtoHSB((reference >>> 16) & 0xff,
                                        (reference >>> 8) & 0xff, reference & 0xff, null)
                                float hueDegrees = hsb[0] * 360.0f
                                boolean materialPixel = (reference >>> 24) != 0 && hsb[1] >= 0.22f
                                        && hueDegrees >= 11.8f && hueDegrees <= 38.2f
                                if (materialPixel) {
                                    if ((reference & 0x00ffffff) != (current & 0x00ffffff)) changedMaterialPixels++
                                }
                            }
                        }
                    }
                    if (transparentPixels == 0 || opaquePixels == 0) {
                        throw new GradleException("Texture must contain both transparent background and opaque artwork: ${texturePath}")
                    }
                    if (tier != 'wood' && changedMaterialPixels == 0) {
                        throw new GradleException("No material palette change found in icon: ${texturePath}")
                    }
                } finally {
                    textureInput.close()
                }

                def entityTextureInput = archive.getInputStream(entityTextureEntry)
                try {
                    def entityImage = javax.imageio.ImageIO.read(entityTextureInput)
                    def itemImageInput = archive.getInputStream(textureEntry)
                    try {
                        def itemImage = javax.imageio.ImageIO.read(itemImageInput)
                        if (entityImage == null || entityImage.width != itemImage.width || entityImage.height != itemImage.height) {
                            throw new GradleException("Back texture dimensions differ from its icon: ${entityTexturePath}")
                        }
                        for (int y = 0; y < itemImage.height; y++) {
                            for (int x = 0; x < itemImage.width; x++) {
                                if ((entityImage.getRGB(x, y) >>> 24) != (itemImage.getRGB(x, y) >>> 24)) {
                                    throw new GradleException("Back texture alpha mask differs from its item icon: ${entityTexturePath}")
                                }
                            }
                        }
                    } finally {
                        itemImageInput.close()
                    }
                } finally {
                    entityTextureInput.close()
                }

                def atlasInput = archive.getInputStream(backAtlasEntry)
                try {
                    def atlas = javax.imageio.ImageIO.read(atlasInput)
                    if (atlas == null || atlas.width != 150 || atlas.height != 170 || atlas.colorModel.numComponents < 4) {
                        throw new GradleException("Back UV atlas must be an RGBA 150x170 PNG: ${backAtlasPath}")
                    }
                    def alpha = atlas.getAlphaRaster()
                    int atlasOpaquePixels = 0
                    for (int y = 0; y < atlas.height; y++) {
                        for (int x = 0; x < atlas.width; x++) {
                            if (alpha.getSample(x, y, 0) == 255) atlasOpaquePixels++
                        }
                    }
                    atlasRects.each { rect ->
                        int left = rect[0] as int
                        int top = rect[1] as int
                        int width = rect[2] as int
                        int height = rect[3] as int
                        int opaquePixels = 0
                        def islandColors = new HashSet<Integer>()
                        for (int y = top; y < top + height; y++) {
                            for (int x = left; x < left + width; x++) {
                                if (alpha.getSample(x, y, 0) == 255) opaquePixels++
                                islandColors.add(atlas.getRGB(x, y) & 0x00ffffff)
                            }
                        }
                        if (opaquePixels != width * height) {
                            throw new GradleException("Back UV island has transparent holes in ${backAtlasPath}: ${rect}")
                        }
                        if (islandColors.size() < 3) {
                            throw new GradleException("Back UV island has no useful texture detail in ${backAtlasPath}: ${rect}")
                        }
                    }
                    // Only painted UV islands need opacity. Opaque padding across
                    // the entire atlas leaked flat material colors onto cuboid faces
                    // after the 2026-10-24 atlas regeneration. Keep unused texels
                    // transparent and verify that every actual face is fully painted.
                    if (atlasOpaquePixels < atlasRects.sum { it[2] * it[3] } / 2) {
                        throw new GradleException("Back UV atlas lost most of its painted islands: ${backAtlasPath}")
                    }
                } finally {
                    atlasInput.close()
                }
            }
            def soundJsonPath = 'assets/jetpack/sounds.json'
            def soundPath = 'assets/jetpack/sounds/jetpack_turbine.ogg'
            [soundJsonPath, soundPath].each { resourcePath ->
                if (!new File(sourceResources, resourcePath).isFile())
                    throw new GradleException("Missing source sound resource: ${resourcePath}")
                if (!new File(processedResources, resourcePath).isFile())
                    throw new GradleException("Resource processing omitted sound resource: ${resourcePath}")
                if (archive.getEntry(resourcePath) == null)
                    throw new GradleException("Missing sound resource in JAR: ${resourcePath}")
            }
            def soundJson = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry(soundJsonPath)))
            if (!(soundJson.jetpack_turbine?.sounds instanceof List)
                    || soundJson.jetpack_turbine.sounds.isEmpty()
                    || soundJson.jetpack_turbine.sounds[0].name != 'jetpack:jetpack_turbine'
                    || soundJson.jetpack_turbine.sounds[0].attenuation_distance != 24
                    || soundJson.jetpack_turbine.sounds[0].stream == true) {
                throw new GradleException('Invalid jetpack turbine sound registration in sounds.json')
            }
            def oggInput = archive.getInputStream(archive.getEntry(soundPath))
            try {
                byte[] oggHeader = new byte[4]
                if (oggInput.read(oggHeader) != 4 || new String(oggHeader, java.nio.charset.StandardCharsets.US_ASCII) != 'OggS') {
                    throw new GradleException('Invalid OGG turbine audio in JAR')
                }
            } finally {
                oggInput.close()
            }
            logger.lifecycle("Verified pack.mcmeta, six inventory icons, six hand models/textures, six back UV atlases, and turbine sound in ${jarFile.name}")
        } finally {
            archive.close()
        }
    }
}
