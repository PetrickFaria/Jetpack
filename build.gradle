plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

group = 'br.com.petrickfaria.jetpack'
version = '0.1.0'
archivesBaseName = 'jetpack'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { jetpack { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { maven { url = 'https://maven.minecraftforge.net/' } }
dependencies { minecraft 'net.minecraftforge:forge:1.19.2-43.5.0' }

jar {
    manifest {
        attributes([
            'Specification-Title': 'jetpack',
            'Specification-Vendor': 'PetrickFaria',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'PetrickFaria',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
