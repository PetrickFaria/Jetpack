plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

group = 'br.com.petrickfaria.jetpack'
version = '0.1.0'
archivesBaseName = 'jetpack'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { jetpack { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test { useJUnitPlatform() }

jar {
    manifest {
        attributes([
            'Specification-Title': 'jetpack',
            'Specification-Vendor': 'PetrickFaria',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'PetrickFaria',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.register('verifyModJarAssets') {
    dependsOn processResources, reobfJar
    doLast {
        // Verify source resources, Gradle's processed output, and the exact distributable JAR.
        def jarFile = tasks.jar.archiveFile.get().asFile
        def sourceResources = file('src/main/resources')
        def processedResources = sourceSets.main.output.resourcesDir
        def tiers = ['wood', 'iron', 'gold', 'emerald', 'diamond', 'netherite']
        def expectedPngHeader = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a] as byte[]
        int[] woodPixels = null
        int woodWidth = -1
        int woodHeight = -1
        def archive = new java.util.zip.ZipFile(jarFile)
        try {
            def packMetaEntry = archive.getEntry('pack.mcmeta')
            if (packMetaEntry == null) throw new GradleException('Missing pack.mcmeta at the JAR root')
            [new File(sourceResources, 'pack.mcmeta'), new File(processedResources, 'pack.mcmeta')].each { file ->
                if (!file.isFile()) throw new GradleException("Resource processing omitted: ${file}")
            }
            def packMeta = new groovy.json.JsonSlurper().parse(archive.getInputStream(packMetaEntry))
            if (packMeta.pack?.pack_format != 9) {
                throw new GradleException('Invalid pack.mcmeta: Minecraft 1.19.2 resource pack_format must be 9')
            }

            tiers.each { tier ->
                def stem = "jetpack_${tier}"
                def modelPath = "assets/jetpack/models/item/${stem}.json"
                def texturePath = "assets/jetpack/textures/item/${stem}.png"
                [modelPath, texturePath].each { resourcePath ->
                    if (!new File(sourceResources, resourcePath).isFile()) {
                        throw new GradleException("Missing source resource: ${resourcePath}")
                    }
                    if (!new File(processedResources, resourcePath).isFile()) {
                        throw new GradleException("Resource processing omitted: ${resourcePath}")
                    }
                }

                def modelEntry = archive.getEntry(modelPath)
                def textureEntry = archive.getEntry(texturePath)
                if (modelEntry == null) throw new GradleException("Missing model in JAR: ${modelPath}")
                if (textureEntry == null) throw new GradleException("Missing texture in JAR: ${texturePath}")

                def model = new groovy.json.JsonSlurper().parse(archive.getInputStream(modelEntry))
                def expectedTexture = "jetpack:item/${stem}"
                if (model.parent != 'minecraft:item/generated' || model.textures?.layer0 != expectedTexture) {
                    throw new GradleException("Invalid item model or texture reference in ${modelPath}")
                }

                def input = archive.getInputStream(textureEntry)
                try {
                    def actualHeader = new byte[expectedPngHeader.length]
                    if (input.read(actualHeader) != actualHeader.length || !java.util.Arrays.equals(actualHeader, expectedPngHeader)) {
                        throw new GradleException("Invalid PNG texture in JAR: ${texturePath}")
                    }
                } finally {
                    input.close()
                }

                def textureInput = archive.getInputStream(textureEntry)
                try {
                    def image = javax.imageio.ImageIO.read(textureInput)
                    if (image == null || image.colorModel.numComponents < 4) {
                        throw new GradleException("Texture has no alpha channel in JAR: ${texturePath}")
                    }
                    if (tier == 'wood') {
                        woodWidth = image.width
                        woodHeight = image.height
                        woodPixels = image.getRGB(0, 0, image.width, image.height, null, 0, image.width)
                    } else {
                        if (image.width != woodWidth || image.height != woodHeight) {
                            throw new GradleException("Icon dimensions differ from the wooden reference: ${texturePath}")
                        }
                    }
                    def alpha = image.getAlphaRaster()
                    def transparentPixels = 0
                    def opaquePixels = 0
                    def changedMaterialPixels = 0
                    for (int y = 0; y < image.height; y++) {
                        for (int x = 0; x < image.width; x++) {
                            int value = alpha.getSample(x, y, 0)
                            if (value == 0) transparentPixels++
                            if (value == 255) opaquePixels++
                            if (tier != 'wood') {
                                int index = y * image.width + x
                                int reference = woodPixels[index]
                                int current = image.getRGB(x, y)
                                if ((current >>> 24) != (reference >>> 24)) {
                                    throw new GradleException("Icon alpha mask differs from wooden reference: ${texturePath}")
                                }
                                float[] hsb = java.awt.Color.RGBtoHSB((reference >>> 16) & 0xff,
                                        (reference >>> 8) & 0xff, reference & 0xff, null)
                                float hueDegrees = hsb[0] * 360.0f
                                boolean materialPixel = (reference >>> 24) != 0 && hsb[1] >= 0.22f
                                        && hueDegrees >= 11.8f && hueDegrees <= 38.2f
                                if (materialPixel) {
                                    if ((reference & 0x00ffffff) != (current & 0x00ffffff)) changedMaterialPixels++
                                } else if ((reference & 0x00ffffff) != (current & 0x00ffffff)) {
                                    throw new GradleException("Non-material icon pixels differ from wooden reference: ${texturePath}")
                                }
                            }
                        }
                    }
                    if (transparentPixels == 0 || opaquePixels == 0) {
                        throw new GradleException("Texture must contain both transparent background and opaque artwork: ${texturePath}")
                    }
                    if (tier != 'wood' && changedMaterialPixels == 0) {
                        throw new GradleException("No material palette change found in icon: ${texturePath}")
                    }
                } finally {
                    textureInput.close()
                }
            }
            def soundJsonPath = 'assets/jetpack/sounds.json'
            def soundPath = 'assets/jetpack/sounds/jetpack_turbine.ogg'
            [soundJsonPath, soundPath].each { resourcePath ->
                if (!new File(sourceResources, resourcePath).isFile())
                    throw new GradleException("Missing source sound resource: ${resourcePath}")
                if (!new File(processedResources, resourcePath).isFile())
                    throw new GradleException("Resource processing omitted sound resource: ${resourcePath}")
                if (archive.getEntry(resourcePath) == null)
                    throw new GradleException("Missing sound resource in JAR: ${resourcePath}")
            }
            def soundJson = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry(soundJsonPath)))
            if (!(soundJson.jetpack_turbine?.sounds instanceof List)
                    || soundJson.jetpack_turbine.sounds.isEmpty()
                    || soundJson.jetpack_turbine.sounds[0].name != 'jetpack:jetpack_turbine'
                    || soundJson.jetpack_turbine.sounds[0].attenuation_distance != 24
                    || soundJson.jetpack_turbine.sounds[0].stream == true) {
                throw new GradleException('Invalid jetpack turbine sound registration in sounds.json')
            }
            def oggInput = archive.getInputStream(archive.getEntry(soundPath))
            try {
                byte[] oggHeader = new byte[4]
                if (oggInput.read(oggHeader) != 4 || new String(oggHeader, java.nio.charset.StandardCharsets.US_ASCII) != 'OggS') {
                    throw new GradleException('Invalid OGG turbine audio in JAR')
                }
            } finally {
                oggInput.close()
            }
            logger.lifecycle("Verified pack.mcmeta, six item models, six recolored icons with the wooden alpha mask, and turbine sound in ${jarFile.name}")
        } finally {
            archive.close()
        }
    }
}
