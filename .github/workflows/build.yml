name: Build Jetpack
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'
      - name: Compile and package
        run: gradle --no-daemon clean build verifyModJarAssets
      - name: Assert one verified distributable
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/jetpack-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one Jetpack distributable, found %s\\n' "${#jars[@]}"
            printf '%s\\n' "${jars[@]}"
            exit 1
          fi
      - name: Upload verified mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jetpack-${{ github.sha }}
          path: build/libs/jetpack-*.jar
          if-no-files-found: error
